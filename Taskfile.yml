version: "3"

tasks:
  cluster:create:
    desc: Create the local kind cluster
    cmds:
      - ./scripts/cluster-create.sh

  cluster:delete:
    desc: Delete the local kind cluster
    cmds:
      - ./scripts/cluster-delete.sh

  cluster:status:
    desc: Show nodes and system pods
    cmds:
      - ./scripts/cluster-status.sh

  registry:create:
    desc: Create the local container registry
    cmds:
      - ./scripts/registry-create.sh

  registry:delete:
    desc: Delete the local container registry
    cmds:
      - ./scripts/registry-delete.sh

  registry:status:
    desc: Inspect the local container registry
    cmds:
      - ./scripts/registry-status.sh

  registry:connect:
    desc: Connect the local registry to the kind cluster
    cmds:
      - ./scripts/registry-connect.sh

  registry:images:
    desc: List images in the local registry
    cmds:
      - ./scripts/registry-images.sh

  registry:tags:
    desc: List tags for an image in the local registry
    requires:
      vars:
        - IMAGE
    cmds:
      - ./scripts/registry-tags.sh "{{.IMAGE}}"

  argocd:install:
    desc: Install Argo CD
    cmds:
      - ./scripts/argocd-install.sh

  argocd:delete:
    desc: Delete Argo CD
    cmds:
      - ./scripts/argocd-delete.sh

  argocd:status:
    desc: Show Argo CD status
    cmds:
      - ./scripts/argocd-status.sh

  argocd:refresh:
    desc: Refresh all Argo CD applications
    cmds:
      - ./scripts/argocd-refresh.sh normal

  argocd:refresh:hard:
    desc: Hard refresh all Argo CD applications
    cmds:
      - ./scripts/argocd-refresh.sh hard

  envoy:install:
    desc: Install Envoy Gateway
    cmds:
      - ./scripts/envoy-install.sh

  envoy:delete:
    desc: Delete Envoy Gateway
    cmds:
      - ./scripts/envoy-delete.sh

  envoy:status:
    desc: Show Envoy Gateway status
    cmds:
      - ./scripts/envoy-status.sh

  envoy:configure:
    desc: Configure the local Envoy Gateway
    cmds:
      - ./scripts/envoy-configure.sh

  envoy:forward:
    desc: Forward the local Envoy Gateway to localhost
    cmds:
      - ./scripts/envoy-forward.sh

  cert-manager:install:
    desc: Install cert-manager
    cmds:
      - ./scripts/cert-manager-install.sh

  cert-manager:status:
    desc: Show cert-manager status
    cmds:
      - ./scripts/cert-manager-status.sh

  cert-manager:delete:
    desc: Delete cert-manager
    cmds:
      - ./scripts/cert-manager-delete.sh

  cert-manager:configure:
    desc: Configure cert-manager
    cmds:
      - ./scripts/cert-manager-configure.sh

  up:
    desc: Create the local platform
    cmds:
      - task: registry:create
      - task: registry:status
      # ---
      - task: cluster:create
      - task: cluster:status
      # ---
      - task: registry:connect
      # ---
      - task: argocd:install
      - task: argocd:status
      # ---
      - task: envoy:install
      # ---
      - task: cert-manager:install
      - task: cert-manager:configure
      - task: cert-manager:status
      # ---
      - task: envoy:configure
      - task: envoy:status

  down:
    desc: Delete the local platform
    cmds:
      - task: cert-manager:delete
      - task: envoy:delete
      - task: argocd:delete
      - task: cluster:delete
      - task: registry:delete

  status:
    desc: Show local platform status
    cmds:
      - task: registry:status
      - task: cluster:status
      - task: argocd:status
      - task: envoy:status
      - task: cert-manager:status
